name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: wesmk
          POSTGRES_DB: wesmk
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - name: Test unit + Postgres integration
        run: go test ./...
        env:
          WESMK_TEST_DATABASE_URL: postgres://postgres:wesmk@localhost:5432/wesmk?sslmode=disable
