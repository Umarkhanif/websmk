services:
  postgres:
    image: postgres:16-alpine
    container_name: wesmk-postgres
    environment:
      POSTGRES_USER: wesmk
      POSTGRES_PASSWORD: wesmk
      POSTGRES_DB: wesmk
    ports:
      - "${WESMK_DB_PORT:-5432}:5432"
    volumes:
      - wesmk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wesmk -d wesmk"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wesmk-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${WESMK_REDIS_PORT:-6379}:6379"
    volumes:
      - wesmk_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  wesmk_pg_data:
  wesmk_redis_data:
